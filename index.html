<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Canopy Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* One committed dark look, after a fleet-ops dashboard: near-black ground, charcoal cards with hairline borders, small muted labels,
   bold white figures, pill controls and one white accent. The 3D shed sits in a rounded card like a live map. */
:root{
  --bg:#0b0b0c; --panel:#141416; --panel2:#1b1b1e; --panel3:#242428; --ink:#f4f4f5; --muted:#8b8b94; --faint:#5d5d66; --line:#232327; --line2:#2e2e34;
  --accent:#ffffff; --accent-ink:#141414; --ok:#62d48f; --warn:#f2a93b; --bad:#f25c4e; --info:#5aa6ff;
  --sky1:#141518; --sky2:#0f1012; --glass:rgba(18,18,20,.8); --shadow:0 8px 30px rgba(0,0,0,.45);
  --f-display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-card:16px; --r-ctl:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--f-body);overflow:hidden;-webkit-text-size-adjust:100%;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#26262b;border-radius:10px;border:3px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

#app{height:100%;display:grid;grid-template-columns:68px minmax(320px,390px) minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);grid-template-areas:"rail top top" "rail panel stage"}
/* icon rail */
#rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;border-right:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;margin-bottom:14px;color:var(--accent-ink)}
.logo svg{width:20px;height:20px}
#rail .rb{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;position:relative}
#rail .rb:hover{background:var(--panel2);color:var(--ink)}
#rail .rb.on{background:var(--ink);color:#111}
#rail .rb svg{width:18px;height:18px}
#rail .rb .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--panel3);color:var(--ink);font-size:12px;font-weight:500;padding:4px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;border:1px solid var(--line2)}
#rail .rb:hover .tip{opacity:1}
/* header: step tabs on the left, live figures on the right */
#top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 18px 0 22px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:none}
.tabs{display:flex;gap:4px;align-self:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;border:0;background:transparent;color:var(--muted);padding:0 12px;font-weight:500;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink)}
.tabs button b{font-weight:600;font-size:11px;color:var(--muted);background:var(--panel3);border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.tabs button.on b{background:var(--accent);color:var(--accent-ink)}
#stats{margin-left:auto;display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.st{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 11px 5px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.st svg{width:14px;height:14px;opacity:.8}
.st b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.st .sb{width:44px;height:4px;border-radius:4px;background:var(--panel3);overflow:hidden}.st .sb i{display:block;height:100%;background:var(--accent)}
.st .sb i.warn{background:var(--warn)}.st .sb i.bad{background:var(--bad)}
.st.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}.st.bad b{color:var(--bad)}

#panel{grid-area:panel;overflow:auto;padding:16px 12px 28px 16px;-webkit-overflow-scrolling:touch}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;margin:16px 16px 16px 4px;border:1px solid var(--line);border-radius:20px;background:radial-gradient(120% 90% at 50% 0%,#17181b,#0e0f11);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fail{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;color:var(--muted)}

.ov{position:absolute;z-index:2;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.ov>*{pointer-events:auto}
.ov-tl{top:12px;left:12px;right:12px}
.ov-b{bottom:12px;left:12px;right:12px;flex-direction:column;align-items:flex-start;flex-wrap:nowrap}
.grp{display:flex;gap:2px;padding:3px;background:var(--glass);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.grp button{border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:9px;font-weight:500;font-size:12.5px;white-space:nowrap}
.grp button:hover{color:var(--ink);background:var(--panel3)}
.grp button.on{background:var(--ink);color:#111}
.hud{border:1px solid var(--line2);background:var(--glass);border-radius:14px;box-shadow:var(--shadow);padding:9px 12px;text-align:left;min-width:210px;max-width:100%;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hud .l1{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.hud .l1 span:last-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.hud .l2{font-size:11px;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:5px;background:var(--panel3);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .25s}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
#selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--glass);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:8px 10px;max-width:100%;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#selbar .nm{font-weight:600;font-size:14px;line-height:1.2}
#selbar .dm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#selbar .iss{flex-basis:100%;color:var(--bad);font-size:12px;font-weight:500}
#selbar .acts{display:flex;gap:4px;flex-wrap:wrap}
.mini{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:500;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.mini:hover{background:var(--panel3)}
.mini.danger{color:var(--bad)}
.nudge,.lift{display:flex;gap:3px}
.nudge .mini{padding:5px 8px;min-width:32px}
.lift .mini{padding:5px 9px}
.grpl{display:flex;align-items:center;gap:7px}
.grpl>span{font-size:11px;color:var(--muted)}

/* panel: every section is a card */
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:14px}
.sec>h3{margin:0;font-weight:600;font-size:14px;letter-spacing:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec>h3::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent)}
.ttl{margin:2px 0 4px;font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.lead{margin:0 0 14px;color:var(--muted);max-width:60ch;font-size:13px}
.ctl{display:flex;flex-direction:column;gap:7px;min-width:0}
.lab{font-size:12px;font-weight:500;color:var(--muted)}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line2);border-radius:12px;background:var(--bg)}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);padding:7px 6px;border-radius:9px;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:hover{color:var(--ink)}
.seg.tight button{padding:7px 3px;font-size:12px}
.seg button.on{background:var(--panel3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2),0 1px 2px rgba(0,0,0,.4)}
.sws{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.12);padding:0;position:relative}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw[data-chk]{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 2px,transparent 2px 6px)}
.sw.cust{overflow:hidden;background:conic-gradient(#e44,#ec4,#4c6,#4ae,#a5e,#e44);display:inline-block}
.sw.cust input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer;border:0;padding:0}
.swn{font-size:12px;color:var(--muted)}
.rng{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.rng input[type=range]{width:100%;accent-color:var(--accent);margin:0;min-height:28px}
.num{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.num input{width:76px;padding:6px 8px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);color:var(--ink);font:500 13px var(--f-body);font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:8px 11px;text-align:left;line-height:1.2}
.chip:hover{background:var(--panel3)}
.chip b{display:block;font-weight:600;font-size:13px}
.chip span{font-size:11px;color:var(--muted)}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed}.chip:disabled:hover{background:var(--panel2)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pick .chip{display:flex;flex-direction:column;gap:3px;padding:9px 10px}
.pick .chip svg{width:100%;height:44px;margin-bottom:3px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.pick .chip.on svg{stroke:var(--accent)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:10px 12px;width:100%;text-align:left;font-size:13px}
.tog i{width:34px;height:20px;border-radius:10px;background:var(--panel3);box-shadow:inset 0 0 0 1px var(--line2);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#8b8b94;transition:transform .15s,background .15s}
.tog.on i{background:var(--accent);box-shadow:none}
.tog.on i::after{transform:translateX(14px);background:#141414}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:500;font-size:13px}
.btn:hover{background:var(--panel3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.5}

/* Blueprint: graphite drafting sheet */
#bp{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;background:#0f1012;cursor:grab;outline:none}
#app.bp #bp{display:block}
#app.bp #gl{visibility:hidden}
#app.bp #fail,#app.bp #hud,#app.bp #selbar{display:none!important}
.ov-br{top:auto;bottom:12px;right:12px;left:auto;width:auto}
.bp-only{display:none}
#app.bp .bp-only{display:flex}
#app.bp .no-bp{display:none}
#bpInsp{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-bottom:12px}
#bpInsp .bpt{margin:0;font-weight:600;font-size:14px;color:var(--ink)}
.bph2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 10px;flex-wrap:wrap}
.bph2 .nm{font-weight:600;font-size:16px;line-height:1.2}
.bph2 .dm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bph2 .acts{display:flex;gap:4px;flex-wrap:wrap}
.bpg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bpf{display:flex;flex-direction:column;gap:4px;min-width:0}
.bpf span{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpf input{width:100%;min-width:0;padding:7px 9px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);color:var(--ink);font:500 14px var(--f-body);font-variant-numeric:tabular-nums;text-align:right}
.bpf input:disabled{opacity:.5}
.bpiss{color:var(--bad);font-size:12px;font-weight:500}
.bpiss:empty{display:none}
.bprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.cats{display:flex;gap:5px;flex-wrap:wrap}
.cats button{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500}
.cats button:hover{color:var(--ink)}
.cats button.on{background:var(--ink);color:#111;border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.row:hover{border-color:var(--line2)}
.row.sel{background:var(--panel3);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.row .dot{width:12px;height:12px;border-radius:4px;border:1px solid rgba(255,255,255,.18)}
.row .nm{font-weight:600;line-height:1.25}
.row .nm small{color:var(--muted);font-weight:500}
.row .dm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .est{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:999px;padding:1px 6px;font-size:10px;font-weight:600;margin-left:5px}
.row button{border:1px solid var(--line2);background:var(--panel3);color:var(--ink);border-radius:9px;min-width:34px;height:30px;padding:0 9px;font-weight:600;font-size:12.5px}
.row.bad .dot{outline:2px solid var(--bad);outline-offset:1px}
.row.off .nm{opacity:.5}.row button:disabled{opacity:.4}.row.rk.sel button:disabled,.row.sel button:disabled{opacity:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row .tag{font-size:10px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:1px 7px;margin-left:6px}
#selbar .mini.on,#bpInsp .mini.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:14px;color:var(--muted);font-size:13px;border:1px dashed var(--line2);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.tbl tr.tot td{font-weight:600;border-bottom:0;font-size:14px}
textarea#code{width:100%;min-height:84px;resize:vertical;padding:9px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);color:var(--ink);font:12px/1.4 var(--f-mono);word-break:break-all}
.msg{font-size:12px;font-weight:500;min-height:16px}
.msg.bad{color:var(--bad)}.msg.good{color:var(--ok)}
.row.warn .nm{color:var(--warn)}.row.bad .nm{color:var(--bad)}
.wleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:2px 0 10px}
.wleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.wstat{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);margin:8px 0}
.axl{margin:8px 0 10px}.axl .axh{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px}.axl .axh b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.plh{font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 2px}
.tbl.parts td{font-size:13px;vertical-align:top}.tbl.parts td:last-child{white-space:nowrap;padding-left:8px}
.tbl.parts .dm{font-size:11.5px;color:var(--muted)}
.nextrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px}

@media (max-width:1100px){ #stats .st.opt{display:none} }
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,50%) minmax(0,1fr);grid-template-areas:"top" "stage" "panel"}
  #app.bp{grid-template-rows:auto minmax(0,56%) minmax(0,1fr)}
  #app.bp .xb,#app.bp .cnt{display:none}
  #rail,#stats{display:none}
  #top{height:50px;padding:0 max(8px,env(safe-area-inset-left,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
  .tabs{flex:1;justify-content:space-between;gap:0}
  .tabs button{padding:0 6px;font-size:13px;gap:5px}
  #stage{margin:8px max(8px,env(safe-area-inset-left,0px)) 0;border-radius:16px}
  #panel{padding:12px max(10px,env(safe-area-inset-right,0px)) 24px max(10px,env(safe-area-inset-left,0px))}
  .hud{min-width:0}
}
.tbtog{display:none}
@media (max-width:820px){
  .ov-tl{top:8px;left:8px;right:8px;gap:5px}
  .tbtog{display:block;border:1px solid var(--line2);background:var(--glass);color:var(--ink);border-radius:11px;box-shadow:var(--shadow);padding:6px 12px;font-weight:500;font-size:12.5px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .ov-tl:not(.open)>.grp:not(.bp-only){display:none}
  .ov-tl.open .tbtog{background:var(--ink);color:#111}
  .ov-tl .grp button{font-size:12px;padding:6px 8px}
  .ov-b{bottom:8px;left:8px;right:8px}
  #selbar{position:relative;flex-wrap:nowrap;gap:4px;padding:5px;width:100%;border-radius:14px}
  #selbar>div:first-child{position:absolute;left:0;bottom:100%;margin-bottom:5px;max-width:100%;background:var(--glass);border:1px solid var(--line2);border-radius:9px;padding:3px 9px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #selbar .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #selbar .dm,#selbar .grpl>span{display:none}
  #selbar .acts,#selbar .grpl,#selbar .nudge,#selbar .lift{flex-wrap:nowrap;flex:1 1 auto;min-width:0;gap:3px}
  #selbar .mini{flex:1 1 0;min-width:26px;min-height:36px;padding:4px 2px}
  #selbar .mini .t{display:none}
  #selbar .iss{position:absolute;left:0;bottom:100%;margin-bottom:33px;flex-basis:auto;font-size:11.5px;background:var(--glass);border-radius:8px;padding:2px 8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const TENT_MNT = {

  tentBraHard: { spMin: 1000, top: ['base', 'tslot'], topLoad: 50 },
  tentSteel:   { spMin: 1000, top: ['tslot', 'aero'], topLoad: 50 },

};

  bra:    { brand: 'bra',    name: 'BASE Platform Rack',       type: 'platform', prof: 'base',  H: 80, kg: 27, load: 150 },

  gen:    { brand: 'gen',    name: 'Basic Roof Bars (pair)',   type: 'bars', prof: 'aero',  H: 70, kg: 8,  load: 80,  spread: 1000 }
};
const PROF = { tslot: 'T-slot channel', base: 'BASE rail', aero: 'aero bar' };
const TENT_OVER = { x: 250, f: 1000, r: 400 }; /* how far a tent may hang past the canopy roof: sides, forward over the cab, rearwards */
const rackName = k => RACKS[k] ? (BRANDS[RACKS[k].brand].name ? BRANDS[RACKS[k].brand].name + ' ' : '') + RACKS[k].name : 'No rack';

const rackHost = items => (items || state.items).find(i => ITEMS[i.key].kind === 'tent' && ITEMS[i.key].hard) || null;

const rackLen = (C, items) => { const h = rackHost(items); return h ? dims(h).d : (C || state.canopy).len; };
const rackSpread = (k, C, items) => { const r = RACKS[k], L = rackLen(C, items); return !r ? 0 : r.type === 'bars' ? Math.min(r.spread, L - 200) : L - 120; };
/* will this tent work with this rack? Hard shells: can the lid carry it. Soft shells: will the tent bolt to it. */
function rackFit(tk, rk, C) {
  const t = ITEMS[tk], r = RACKS[rk];
  if (t.hard) {
    if (!r) return { ok: true, why: '' };
    if (t.top.indexOf(r.prof) < 0) return { ok: false, why: 'Its lid rails do not take ' + rackName(rk) + ' (' + PROF[r.prof] + 's)' };
    if (r.kg > t.topLoad) return { ok: false, why: rackName(rk) + ' weighs ' + r.kg + ' kg; the lid is rated ' + t.topLoad + ' kg' };
    const L = t.L, sp = r.type === 'bars' ? Math.min(r.spread, L - 200) : L;
    if (r.type === 'bars' && sp < 600) return { ok: false, why: 'The lid is too short for ' + rackName(rk) };
    return { ok: true, why: '' };
  }
  if (!r) return { ok: false, why: 'Needs a roof rack to bolt to' };
  if (rackHost() ) return { ok: false, why: 'The rack is on the hard shell, so this tent has nothing to bolt to' };
  if (t.mnt.indexOf(r.prof) < 0) return { ok: false, why: 'Its mounts do not suit ' + rackName(rk) + ' (' + PROF[r.prof] + 's)' };
  if (r.load < t.kg) return { ok: false, why: rackName(rk) + ' is rated ' + r.load + ' kg; the tent is ' + t.kg + ' kg' };
  const sp = rackSpread(rk, C);
  if (sp < t.spMin) return { ok: false, why: rackName(rk) + ' only spreads ' + sp + ' mm on this canopy; the tent needs ' + t.spMin + ' mm' };
  return { ok: true, why: '' };
}
/* weight the lid of the host tent carries: the rack plus the gear on it, against the lower of the rack and lid ratings */
function topLoad(lay) {
  const h = rackHost(), r = RACKS[state.canopy.rack];
  if (!h || !r) return null;
  lay = lay || layout();
  const kg = r.kg + state.items.filter(i => lay.get(i.id) && lay.get(i.id).on === h.id).reduce((a, i) => a + itemKg(i), 0);
  return { kg: Math.round(kg), max: Math.min(r.load + r.kg, ITEMS[h.key].topLoad), host: h };
}
/* the tent maker's own rack, or a plain set of bars if they do not make one */
function rackForTent(tk) { const b = ITEMS[tk].brand; return Object.keys(RACKS).find(k => RACKS[k].brand === b) || 'gen'; }
const tentsOnRoof = () => state.items.filter(i => ITEMS[i.key].kind === 'tent');

function rackBlock(rk) { for (const t of tentsOnRoof()) { const f = rackFit(t.key, rk); if (!f.ok) return ITEMS[t.key].name + ': ' + f.why; } return ''; }
/* An awning's open side (sx) and hinge end (sz), in the bag's own frame: it opens away from the canopy, and a wing hinges at the rear
   corner (or the right-hand corner when the bag runs across the back). */
function awnSides(it) {
  const G = geo(), R = G.roof, r = (it.rot || 0) * Math.PI / 180, lx = [Math.cos(r), -Math.sin(r)], lz = [Math.sin(r), Math.cos(r)];
  const along = Math.abs(lz[1]) > 0.5, out = along ? [it.x < (R.x0 + R.x1) / 2 ? -1 : 1, 0] : [0, it.z < (R.z0 + R.z1) / 2 ? -1 : 1], hr = along ? [0, 1] : [1, 0];
  const sg = v => v < 0 ? -1 : 1;
  return { sx: sg(out[0] * lx[0] + out[1] * lx[1]), sz: sg(hr[0] * lz[0] + hr[1] * lz[1]) };
}
/* the ground an open awning covers, as a polygon of [x, z] in mm */
function awnShape(it) {
  const d = ITEMS[it.key], { sx, sz } = awnSides(it), r = (it.rot || 0) * Math.PI / 180, R = d.reach || 2500;

   Angled works the bend and the step-in out from the height. Custom takes all three from the person. All mm. */
function canopyProf(C) {
  C = C || state.canopy;

/* The headboard's outline from the front: h tall in all, straight up to the bend, then angled in. null when there is none. */

  if (T.headShape === 'custom') { bend = T.hbBend; up = T.hbTop; inset = T.hbIn; }
  else if (T.headShape === 'square') { bend = base; up = 0; inset = 0; }
  else { bend = Math.round(base * 0.55); up = base - bend; inset = Math.round(base * 0.3); }
  inset = Math.min(inset, Math.max(0, T.wid / 2 - 250));
  if (up < 20) { bend += up; up = 0; inset = 0; } /* nothing above the bend to angle: it is a square board */
  return { h: bend + up, bend, up, inset, rack: T.head === 'full' };
}
function geo() {

/* Orientation in 90 degree steps: matrix = spin about Y (rot) x roll about Z (rz) x tip about X (rx), acting on the item's own axes (x = W, y = H, z = L). */
const QT = [[1, 0], [0, 1], [-1, 0], [0, -1]]; /* cos, sin for 0/90/180/270 */

/* turn an item 90 degrees about a world axis and store the result back as rot / rz / rx */
function turnItem(it, ax) {

}

/* where an item may go: tents can hang past the roof, awnings sit on its edge, other roof gear can also ride on a tent's top bars */
function areaFor(it) {

/* Works out how high each item sits and what is wrong with it. Returns Map(id -> { y, issues[] }). */
function layout(items) {
  items = items || state.items;
  const G = geo(), out = new Map();
  const floor = items.filter(i => ITEMS[i.key].mount === 'floor');
  const roof = items.filter(i => ITEMS[i.key].mount === 'roof');
  const boxes = new Map();
  const dyOf = i => i.dy || 0;
  floor.concat(roof).forEach(i => boxes.set(i.id, box(i)));
  /* supports sit at their own lift; everything else rests on the highest support under it, plus its own lift */
  /* gear that sits in the canopy rests on the false floor; gear on the open tray deck does not */
  const baseOf = i => G.floorY && ov(boxes.get(i.id), G.outer) ? G.floorY : 0;
  floor.filter(i => ITEMS[i.key].support).forEach(i => out.set(i.id, { y: baseOf(i) + dyOf(i), issues: [] }));
  floor.filter(i => !ITEMS[i.key].support).forEach(i => {
    const b = boxes.get(i.id);
    let y = baseOf(i);
    floor.forEach(o => {
      if (o !== i && ITEMS[o.key].support && ov(b, boxes.get(o.id), 5)) y = Math.max(y, out.get(o.id).y + ITEMS[o.key].H);
    });
    out.set(i.id, { y: y + dyOf(i), issues: [] });

  floor.forEach(i => {
    const b = boxes.get(i.id), o = out.get(i.id), top = o.y + b.h;
    if (b.x0 < G.deck.x0 - 1 || b.x1 > G.deck.x1 + 1 || b.z0 < G.deck.z0 - 1 || b.z1 > G.deck.z1 + 1) o.issues.push('Hangs off the tray');
    if (ov(b, G.outer)) {
      if (b.x0 < G.inner.x0 - 1 || b.x1 > G.inner.x1 + 1 || b.z0 < G.inner.z0 - 1 || b.z1 > G.inner.z1 + 1) o.issues.push('Clashes with the canopy wall');
      else if (top > G.innerH + 1) o.issues.push('Too tall by ' + Math.round(top - G.innerH) + ' mm');
      else if (G.prof.inset > 0) {
        /* above the bend the walls lean in, so the room across gets narrower with height */
        const f = clamp((top - G.prof.bend) / Math.max(1, G.innerH - G.prof.bend), 0, 1);
        if (f > 0) { const hw = G.inner.x1 - G.prof.inset * f; if (b.x1 > hw + 1 || b.x0 < -hw - 1) o.issues.push('Pokes through the angled side'); }
      }

    floor.forEach(p => {
      if (p === i) return;
      const pb = boxes.get(p.id), po = out.get(p.id);
      if (ov(b, pb, 1) && o.y < po.y + pb.h - 1 && po.y < top - 1) o.issues.push('Overlaps ' + ITEMS[p.key].name);
    });
  });
  roof.forEach(i => out.set(i.id, { y: dyOf(i), issues: [] }));
  const tents = roof.filter(i => ITEMS[i.key].kind === 'tent');
  /* gear that sits wholly over a hard shell tent rides on the rack on its lid */
  const host = rackHost(items), rk = state.canopy.rack, RK = RACKS[rk];
  roof.forEach(i => {
    const k = ITEMS[i.key].kind;
    if (!host || k === 'tent' || k === 'awning' || !inside(boxes.get(i.id), boxes.get(host.id), 5)) return;
    const o = out.get(i.id); o.y = out.get(host.id).y + boxes.get(host.id).h + (RK ? RK.H : 0) + dyOf(i); o.on = host.id;
    if (!RK) o.issues.push('Needs a rack on the tent to sit on');
  });

  roof.forEach(i => {
    const d = ITEMS[i.key], b = boxes.get(i.id), o = out.get(i.id), top = o.y + b.h;
    const off = A => b.x0 < A.x0 - 1 || b.x1 > A.x1 + 1 || b.z0 < A.z0 - 1 || b.z1 > A.z1 + 1;
    if (d.kind === 'tent') {
      if (off(areaFor(i))) o.issues.push('Hangs too far past the canopy');
      const f = rackFit(i.key, rk);

      else if (d.hard) {
        /* bolts to the canopy roof tracks: enough of it has to be over the roof */
        const zo = Math.min(b.z1, R.z1 - 60) - Math.max(b.z0, R.z0 + 60), xo = Math.min(b.x1, R.x1) - Math.max(b.x0, R.x0);

      } else {

        const zo = Math.min(b.z1, r1) - Math.max(b.z0, r0), xo = Math.min(b.x1, R.x1) - Math.max(b.x0, R.x0);
        if (zo < d.spMin - 1) o.issues.push('Only ' + Math.max(0, Math.round(zo)) + ' mm of it is over the rack; it needs ' + d.spMin + ' mm');
        else if (xo < Math.min(b.x1 - b.x0, R.x1 - R.x0) * 0.8) o.issues.push('Too far off to the side of the rack');

/* First free position for a new item: front to back, left to right, then rotated 90 degrees. */
function findSpot(key) {
  const d = ITEMS[key], G = geo(), R = G.roof, rnd = v => Math.round(v * 2) / 2;
  const clear = it => layout(state.items.concat([it])).get(-1).issues.length === 0;
  if (d.kind === 'awning') {
    /* along the passenger (left) side, then the driver side, then across the back */
    const zc = (R.z0 + R.z1) / 2;
    for (const [x, z, rot] of [[R.x0 - d.W / 2, zc, 0], [R.x1 + d.W / 2, zc, 0], [0, R.z1 + d.W / 2, 90]])
      if (clear({ id: -1, key, x, z, rot })) return { x: rnd(x), z: rnd(z), rot, ok: true };
    return { x: rnd(R.x0 - d.W / 2), z: rnd(zc), rot: 0, ok: false };
  }
  const passes = d.mount === 'roof' ? [[R, 25], [areaFor({ key, rot: 0 }), 25]] : [[G.inner, 25], [G.deck, 50]];
  for (const [area, step] of passes) {
    for (const rot of [0, 90]) {
      const w = rot ? d.L : d.W, dp = rot ? d.W : d.L, cand = [];
      for (let z = area.z0 + dp / 2; z <= area.z1 - dp / 2 + 0.01; z += step)
        for (let x = area.x0 + w / 2; x <= area.x1 - w / 2 + 0.01; x += step) cand.push([x, z]);
      /* a tent goes as central on the roof as it can */
      if (d.kind === 'tent') { const zm = (R.z0 + R.z1) / 2; cand.sort((a, b) => (a[0] * a[0] + (a[1] - zm) * (a[1] - zm)) - (b[0] * b[0] + (b[1] - zm) * (b[1] - zm))); }
      for (const [x, z] of cand) if (clear({ id: -1, key, x, z, rot })) return { x: rnd(x), z: rnd(z), rot, ok: true };
    }
  }
  const a = d.mount === 'roof' ? R : G.deck;
  return { x: 0, z: rnd((a.z0 + a.z1) / 2), rot: 0, ok: false };
}

/* Snap an item's centre to nearby walls, neighbouring edges, or a grid. With no options the grid is 10 mm on the centre.
   The blueprint passes o = { x0, z0, g, magnet }: the grid then counts from that datum corner to the item's edge, so the gaps come out as round numbers,

    tx.push(wall.x0 + d.w / 2, wall.x1 - d.w / 2); tz.push(wall.z0 + d.d / 2, wall.z1 - d.d / 2);
    state.items.filter(q => q !== it && ITEMS[q.key].mount === mount).map(box).forEach(q => {

/* ---------- Weights (kg). Tray and canopy are rough estimates from area and material. ---------- */
function weights() {
  const T = state.tray, C = state.canopy, alu = m => m === 'alu', hasT = T.design !== 'none', hasC = C.shape !== 'none';
  let tray = 0;
  if (hasT) {
    tray = (T.len * T.wid / 1e6) * (alu(T.mat) ? 27 : 45);
    tray += T.head === 'full' ? 14 : T.head === 'half' ? 6 : 0;
    /* a design with its own sides carries their weight; the flat deck only has them if you add drop sides behind the canopy */
    tray += (T.design === 'flat' ? T.sides === 'drop' : TRAYS[T.design].side > 0) ? (alu(T.mat) ? 18 : 30) : 0;
    tray += (T.boxes === 'both' ? 2 : T.boxes === 'none' ? 0 : 1) * (BOX_STYLES[T.boxStyle] || BOX_STYLES.drop).kg + (GUARDS[T.guards] ? GUARDS[T.guards].kg || 0 : 0);
  }
  const spare = hasT && SPARE[T.spare] ? SPARE[T.spare].kg : 0;

    const area = 2 * cl * ch + 2 * cw * ch + cw * cl;

    canopy += doors * (alu(C.mat) ? 7 : 12) + (C.windows ? doors * 2 : 0) + (RACKS[C.rack] ? RACKS[C.rack].kg : 0) + (C.jack ? 12 : 0);
    const f = floorKg(C); canopy += f.beams + f.ply + f.carpet;

  return { tray: Math.round(tray), canopy: Math.round(canopy), spare: Math.round(spare), gear: Math.round(gear), total: Math.round(tray + canopy + spare + gear) };
}

function roofTop() {
  const G = geo();
  if (G.none) return 0;
  const lay = layout();
  let top = G.roofY;
  state.items.forEach(i => { if (ITEMS[i.key].mount === 'roof') top = Math.max(top, G.roofY + lay.get(i.id).y + dims(i).h + (rackOnTent() && rackHost() === i ? RACKS[state.canopy.rack].H : 0)); });
  return top;
}

/* ---------- Items ---------- */
function addItem(key) {
  /* a tent comes with its maker's rack by default */
  if (ITEMS[key].kind === 'tent' && !(ITEMS[key].hard && rackHost())) state.canopy.rack = rackForTent(key);
  const s = findSpot(key);
  const it = { id: state.nextId++, key, x: s.x, z: s.z, rot: s.rot, rx: 0, rz: 0, dy: 0 };
  state.items.push(it);
  return { it, ok: s.ok };
}
function getItem(id) { return state.items.find(i => i.id === id) || null; }
function removeItem(id) {
  state.items = state.items.filter(i => i.id !== id);
  if (state.sel === id) state.sel = null;
  cleanWires();
}

/* ---------- 12V wiring. Terminals sit on the gear; a wire runs between two terminals through waypoints stuck to canopy surfaces.

const SURF_KEYS = ['fl', 'rf', 'wl', 'wr', 'wf', 'wb', 'ro'];

/* cable sizes: [mm², label, rough continuous amps]. A guide only: check the cable maker's chart. */
const CABLES = [[2.5, '2.5 mm²', 20], [4, '4 mm²', 30], [6, '6 mm²', 40], [8.4, '8 B&S', 55], [13.3, '6 B&S', 75], [21.2, '4 B&S', 105], [33.6, '2 B&S', 140], [53.5, '0 B&S', 190], [85, '000 B&S', 260]];
const FUSES = [5, 7.5, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250, 300];
const CABLE_OFF = 7;

/* Terminals per item: t = id, n = name, role, a = amps it draws or delivers, at = position as fractions of the item (x across, y up, z along). */
function termsOf(key) {
  const d = ITEMS[key];
  if (!d) return [];
  switch (d.kind) {
    case 'fridge': return [{ t: 'dc', n: '12V in', role: 'load', a: d.dual ? 8 : 6, at: [0.32, 0.22, -0.5] }];
    case 'battery': return [{ t: 'main', n: 'Terminals', role: 'bat', at: [0, 1, 0.3] }];
    case 'dcdc': return [{ t: 'in', n: 'Vehicle in', role: 'chgIn', a: Math.round(d.amps * 1.25), at: [-0.28, 0.5, -0.5] },
      { t: 'sol', n: 'Solar in', role: 'solIn', a: 15, at: [0.28, 0.5, -0.5] }, { t: 'out', n: 'To battery', role: 'chgOut', a: d.amps, at: [0, 0.5, 0.5] }];
    case 'inverter': return [{ t: 'dc', n: '12V in', role: 'load', a: Math.ceil(d.watts / 12 / 0.88), at: [0, 0.5, -0.5] }];
    case 'fusebox': return [{ t: 'in', n: 'Supply in', role: 'busIn', at: [-0.32, 1, 0] }, { t: 'out', n: 'Circuits out', role: 'busOut', at: [0.32, 1, 0] }];
    case 'solar': return [{ t: 'pv', n: 'Panel out', role: 'src', a: Math.round(200 / 18), at: [0, 1, -0.45] }];

/* a thin trim piece: flat shaded and casts no shadow, so it never speckles the panel under it */
function flat(rings, mat) { const m = loft(rings, mat, false); m.castShadow = false; return m; }

function buildVehicle() {
  const T = state.tray, g = new THREE.Group(), gc = new THREE.Group(), VG = vehGeo(), V = VG.V, S = VSPEC[V.look] || VSPEC.hilux, F = S.face, G = S.gh, TS = tyreSpec(T), lift = T.lift * MM;

    chrome: std('#d4d8dc', 0.2, 0.85), silver: std('#a9afb5', 0.35, 0.6), glass: std('#1a2836', 0.08, 0.55), plate: std('#f1efe6', 0.6, 0), bay: std('#0e0f11', 0.9, 0),

  /* wheel arch: superellipse over the front wheel, in mm */

  /* the nose surface: corners wrap back, the bumper pushes forward, the bonnet edge rolls over */
  const hwN = S.front[0][1] * MM;
  const zFace = (x, y) => {
    const t = clamp((Math.abs(x) - F.cx * MM) / Math.max(0.05, hwN - F.cx * MM), 0, 1.2), h = y / MM + V.deckH;
    let z = zN + F.back * t * t;

  };

  /* ---- front body: nose to the base of the windscreen ---- */

  const crAt = z => S.crease ? { h: S.crease.hF + (S.crease.hR - S.crease.hF) * clamp((z - zN) / (zBack - zN), 0, 1), inB: S.crease.inB * clamp((z - (zN + F.back + 0.2)) / 0.3, 0, 1), inA: S.crease.inA * clamp((z - (zN + F.back + 0.2)) / 0.3, 0, 1) } : null;

  const ybAt = z => Math.max(baseBot(z), archY(z));
  const fr = [];

  g.add(loft(fr, paint));

  /* ---- cab body: doors, from the cowl to the back of the cab ---- */
  const beltAt = u => S.cab.beltF + (S.cab.beltR - S.cab.beltF) * clamp((u - uc) / (ub - uc), 0, 1);
  const cabRing = z => {
    const b = beltAt((z - fa) / MM), hw = S.hw - (z > zBack - 0.05 ? 10 : 0);

  };
  const zsC = [zCab - 0.03, zBack - 0.06, zBack - 0.02];
  for (let i = 0; i <= 30; i++) zsC.push(fa + Ra * MM * Math.sin(-Math.PI / 2 + Math.PI * i / 30));
  for (let z = zCab; z < zBack; z += 0.1) zsC.push(z);

    const P = [[G.wsTopU, G.roofF], [G.wsTopU + roofLen * 0.35, G.peak], [ub - 120, G.roofR], [ub, G.backTop]];
    for (let i = 0; i < 3; i++) if (u <= P[i + 1][0]) return P[i][1] + (P[i + 1][1] - P[i][1]) * (u - P[i][0]) / (P[i + 1][0] - P[i][0]);
    return G.backTop;
  };
  const crownAt = u => G.crown * clamp((u - G.wsTopU) / 150, 0, 1);
  const rAt = u => Math.min(G.r, (ghTop(u) - beltAt(u)) * 0.45);

    const b = beltAt(u), top = ghTop(u), r = rAt(u), yS = top - r, xS = xPlane(u, yS), cx = xS - r;

  for (let i = 0; i <= 6; i++) ghU.push(uc + (G.wsTopU - uc) * i / 6);
  for (let u = G.wsTopU + 100; u < ub - 120; u += 100) ghU.push(u);
  for (let i = 1; i <= 3; i++) ghU.push(ub - 120 + 25 * i);
  g.add(loft(uniqSorted(ghU, 8).map(ghRing), paint));

  /* side glass on the leaning plane */
  const topW = u => Math.min(ghTop(u), ghTop(u - G.ap)) - G.r - G.header;
  const winPoly = (w, gr, rad) => {
    let u0 = w.u0 - gr; const u1 = w.u1 + gr, sl = w.slant || 0, kick = w.kick || 0;
    const bot = u => beltAt(u) + 15 - gr + kick * clamp((u - (u1 - 260)) / 260, 0, 1);
    const top = u => topW(u) + gr;
    while (top(u0) < bot(u0) + 35 && u0 < u1 - 120) u0 += 5;
    const uR = u1 - sl, pts = [[u0, bot(u0)]];
    if (kick) pts.push([u1 - 260, bot(u1 - 260)]);
    pts.push([u1, bot(u1)], [uR, top(uR)]);
    const brk = [G.wsTopU, G.wsTopU + G.ap, G.wsTopU + roofLen * 0.35, G.wsTopU + roofLen * 0.35 + G.ap, ub - 120, ub - 120 + G.ap].filter(q => q > u0 + 30 && q < uR - 30).sort((p, q) => q - p);
    brk.forEach(q => pts.push([q, top(q)]));

  };

    poly.map(([u, h]) => [s * (xPlane(u, h) + out) * MM, Y(h), Z(u)]), poly.map(([u, h]) => [s * (xPlane(u, h) - inn) * MM, Y(h), Z(u)])], mat)));
  const D = S.dlo(T.cab, uc, ub);
  if (S.dloBlack) { const a = D.wins[0], b = D.wins[D.wins.length - 1]; sidePiece(winPoly({ u0: a.u0, u1: b.u1, slant: b.slant, kick: b.kick }, 24, 60), 2, 25, M.black); }

  { const a = D.wins[0].u0 + 120, b = D.wins[D.wins.length - 1].u1 + 10;
    sidePiece(roundPoly([[a, beltAt(a) - 6], [b, beltAt(b) - 6], [b, beltAt(b) + 12], [a, beltAt(a) + 12]], 6, 60), 8, 10, S.dloBlack ? M.black : M.trim); }

  /* windscreen with black surround and wipers */
  { const u0 = uc + 70, u1 = G.wsTopU - 40, dy = Y(ghTop(u1)) - Y(ghTop(u0)), dz = Z(u1) - Z(u0), ln = Math.hypot(dy, dz), n = [0, dz / ln, -dy / ln];
    const wsPts = (a, b, grow, d) => {
      const h0 = ghTop(a), h1 = ghTop(b), x0 = (cxAt(a) - 45 + grow) * MM, x1 = (cxAt(b) - 45 + grow) * MM;
      return [[-x0, Y(h0), Z(a)], [x0, Y(h0), Z(a)], [x1, Y(h1), Z(b)], [-x1, Y(h1), Z(b)]].map(p => [p[0], p[1] + n[1] * d, p[2] + n[2] * d]);
    };
    g.add(flat([wsPts(u0 - 25, u1 + 25, 25, 0.002), wsPts(u0 - 25, u1 + 25, 25, -0.03)], M.black));
    g.add(flat([wsPts(u0, u1, 0, 0.006), wsPts(u0, u1, 0, -0.03)], M.glass));
    const th = Math.atan2(-dy, dz);
    [-0.25, 0.3].forEach(x => { const m = rbox(0.55, 0.012, 0.025, 0.005, M.black, x, Y(ghTop(u0 + 40)) + n[1] * 0.015, Z(u0 + 40) + n[2] * 0.015); m.rotation.x = th; g.add(m); });
    g.add(rbox((wB - 60) * 2 * MM, 0.03, 0.14, 0.012, M.black, 0, Y(S.front[S.front.length - 1][8]) + 0.006, zCab + 0.02));
  }

  { const bR = beltAt(ub), tR = ghTop(ub - 20) - G.r - 35, xr = h => (xPlane(ub, h) - 95) * MM, zr = zBack - 0.02;
    const rw = [[-xr(bR + 95), Y(bR + 95)], [xr(bR + 95), Y(bR + 95)], [xr(tR), Y(tR)], [-xr(tR), Y(tR)]];
    g.add(flat([rw.map(([x, y]) => [x * 1.05, y + (y > Y(bR + 200) ? 0.02 : -0.02), zr + 0.003]), rw.map(([x, y]) => [x * 1.05, y, zr - 0.02])], M.black));

  });
  { const path = [];
    for (let z = zN + F.back * 0.6 + 0.1; z < zCab - 0.03; z += 0.08) { const p = stAt(z); path.push([p[5] * MM, Y(p[6]) + 0.001, z]); }

/* ---------- Gear models. Local origin is the bottom centre; x = across (W), z = long side (L). ---------- */

  g.userData.key = key;

  switch (d.kind) {
    case 'fridge': {
      const bh = h * 0.8, lh = h - bh;
      g.add(rbox(w, bh, dp, 0.02, S(d.col, 0.5, 0.1), 0, bh / 2, 0));
      g.add(rbox(w + 0.004, lh, dp + 0.004, 0.02, S(d.lid, 0.4, 0.05), 0, bh + lh / 2, 0));
      g.add(rbox(w + 0.006, 0.025, dp + 0.006, 0.006, S(d.acc, 0.5, 0.1), 0, bh - 0.035, 0));
      if (d.dual) g.add(rbox(w + 0.008, lh * 0.9, 0.008, 0.002, dark, 0, bh + lh / 2, dp * 0.1));
      g.add(rbox(w * 0.45, 0.03, 0.04, 0.012, dark, 0, bh + lh * 0.4, dp / 2 + 0.022));
      g.add(rbox(0.1, 0.05, 0.012, 0.006, dark, w * 0.28, bh * 0.55, dp / 2 + 0.006));

    }
    case 'battery': {

      g.add(rbox(w * 0.98, h * 0.12, dp * 0.98, 0.006, S('#2b2f33', 0.6, 0.1), 0, h * 0.94, 0));
      g.add(cyl(0.014, 0.02, S('#c0392b', 0.5, 0.2), -w * 0.3, h + 0.008, dp * 0.25, 'y', 8));
      g.add(cyl(0.014, 0.02, S('#111214', 0.5, 0.2), w * 0.3, h + 0.008, dp * 0.25, 'y', 8));
      g.add(rbox(w * 0.5, 0.05, 0.004, 0.002, S('#e8742c', 0.6, 0), 0, h * 0.5, dp / 2 + 0.002));
      break;
    }
    case 'dcdc': {
      const red = S('#c8282d', 0.5, 0.2), led = (c, x) => g.add(rbox(0.008, 0.004, 0.008, 0.002, S(c, 0.5, 0, { emissive: new THREE.Color(c), emissiveIntensity: 0.9 }), x, h + 0.001, dp * 0.3));
      g.add(rbox(w, h, dp, 0.006, S('#26292d', 0.45, 0.45), 0, h / 2, 0));
      [-1, 1].forEach(s => g.add(rbox(w + 0.002, h + 0.002, dp * 0.14, 0.004, red, 0, h / 2, s * (dp / 2 - dp * 0.07))));
      for (let i = 0; i < 6; i++) g.add(rbox(w * 0.9, 0.003, dp * 0.045, 0.0012, S('#3a3f45', 0.5, 0.5), 0, h + 0.0008, -dp * 0.22 + i * dp * 0.085));
      [-1, 1].forEach(s => g.add(cyl(0.007, 0.012, steelM, s * w * 0.28, h * 0.5, -dp / 2 - 0.004, 'z', 8)));
      led('#58e08a', -w * 0.18); led('#ffb347', 0); led('#4aa8ff', w * 0.18);
      break;
    }
    case 'inverter': {
      const red = S('#c8282d', 0.5, 0.2), body = S('#2b2e32', 0.5, 0.4);
      g.add(rbox(w, h, dp, 0.008, body, 0, h / 2, 0));
      g.add(rbox(w + 0.002, h + 0.002, dp * 0.16, 0.006, red, 0, h / 2, dp / 2 - dp * 0.08));
      for (let i = 0; i < 9; i++) g.add(rbox(w * 0.84, 0.004, 0.006, 0.002, S('#16181a', 0.7, 0.2), 0, h + 0.001, -dp * 0.4 + i * dp * 0.052));
      [-1, 1].forEach(s => { g.add(rbox(w * 0.22, h * 0.5, 0.01, 0.004, S('#d9dde0', 0.5, 0.2), s * w * 0.22, h * 0.45, dp / 2 + 0.003)); g.add(rbox(w * 0.14, h * 0.2, 0.012, 0.004, dark, s * w * 0.22, h * 0.45, dp / 2 + 0.004)); });
      g.add(rbox(0.012, 0.012, 0.01, 0.004, S('#58e08a', 0.5, 0, { emissive: new THREE.Color('#58e08a'), emissiveIntensity: 0.9 }), 0, h * 0.78, dp / 2 + 0.004));

    case 'fusebox': {

      g.add(rbox(w * 0.96, h * 0.3, dp * 0.96, 0.006, S('#c8282d', 0.5, 0.15), 0, h * 0.85, 0));
      ['#e8c14a', '#4aa8ff', '#d9534f', '#58b368', '#e8c14a', '#9a9fa5'].forEach((c, i) => g.add(rbox(w * 0.2, 0.006, dp * 0.12, 0.002, S(c, 0.5, 0.1), -w * 0.25 + (i % 3) * w * 0.25, h + 0.002, (i < 3 ? -1 : 1) * dp * 0.2)));

    }
    case 'solar': {
      g.add(rbox(w, h, dp, 0.008, S('#b9bec3', 0.4, 0.5), 0, h / 2, 0));
      const cell = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.03, dp - 0.03),

    }
    case 'boards': {
      for (let i = 0; i < 2; i++) g.add(rbox(w, h / 2 - 0.004, dp, 0.01, S('#e8742c', 0.6, 0.05), 0, h / 4 + i * h / 2, 0));
      for (let k = 0; k < 6; k++) g.add(rbox(w * 0.9, 0.01, 0.03, 0.004, dark, 0, h + 0.003, -dp / 2 + 0.1 + k * (dp - 0.2) / 5));
      break;
    }
    case 'wheel': {
      const wg = wheelGroup(w / 2, h, S);
      wg.rotation.z = Math.PI / 2; wg.position.y = h / 2;
      g.add(wg);
      break;
    }
    case 'tent': {
      const sh = S(d.col || '#2b2e31', 0.5, 0.12), ac = S(d.acc || '#c9bd9f', 0.55, 0.08), st = d.style || 'box';
      const ring = (z, y0, y1, ww, r) => Array.from({ length: 20 }, (_, i) => { const a = i / 20 * Math.PI * 2, c = Math.cos(a), sn = Math.sin(a), k = 0.35;
        return [ww / 2 * Math.sign(c) * Math.pow(Math.abs(c), k), (y0 + y1) / 2 + (y1 - y0) / 2 * Math.sign(sn) * Math.pow(Math.abs(sn), k), z]; });
      if (st === 'soft') {
        /* aluminium base, PVC travel cover with a zip line and two straps */
        g.add(rbox(w, h * 0.16, dp, 0.008, S('#9aa0a6', 0.4, 0.6), 0, h * 0.08, 0));
        g.add(loft([-0.5, -0.47, -0.4, 0.4, 0.47, 0.5].map((f, i) => ring(f * dp, h * 0.15, h * (i === 0 || i === 5 ? 0.82 : 1), w * (i === 0 || i === 5 ? 0.94 : 0.99))), sh));
        g.add(rbox(w * 1.002, 0.014, dp * 1.002, 0.005, ac, 0, h * 0.34, 0));
        [-0.27, 0.27].forEach(f => g.add(rbox(0.05, h * 0.88, dp * 1.01, 0.01, S('#1b1d20', 0.7, 0.05), f * w, h * 0.57, 0)));
        g.add(rbox(w * 0.3, 0.06, 0.02, 0.01, S('#b9bec3', 0.4, 0.6), 0, h * 0.22, dp / 2 + 0.008));
      } else if (st === 'clam') {
        /* hard shell that hinges at the front and lifts at the back: a low base and a wedge lid */
        g.add(rbox(w, h * 0.32, dp, 0.03, sh, 0, h * 0.16, 0));
        g.add(loft([-0.5, -0.46, 0, 0.46, 0.5].map((f, i) => { const top = h * (0.55 + 0.45 * (f + 0.5)); return ring(f * dp, h * 0.3, top, w * (i === 0 || i === 4 ? 0.95 : 1)); }), sh));
        g.add(rbox(w * 1.004, 0.016, dp * 1.004, 0.006, ac, 0, h * 0.32, 0));
        [-0.42, 0.42].forEach(f => g.add(rbox(0.05, 0.03, 0.03, 0.01, ac, f * w, h * 0.33, dp / 2 + 0.01)));
        for (let i = 0; i < 3; i++) g.add(rbox(w * 0.7, 0.008, 0.03, 0.004, S('#000000', 0.6, 0.1), 0, h * (0.6 + 0.12 * i) + 0.004, (-0.25 + 0.25 * i) * dp));
      } else {

        g.add(rbox(w, h * 0.5, dp, 0.04, sh, 0, h * 0.25, 0));
        g.add(rbox(w * 1.004, h * 0.5, dp * 1.004, 0.07, sh, 0, h * 0.75, 0));
        g.add(rbox(w * 1.008, 0.016, dp * 1.008, 0.006, S('#121416', 0.6, 0.1), 0, h * 0.5, 0));
        [[-0.4, 0.5], [0.4, 0.5], [-0.4, -0.5], [0.4, -0.5]].forEach(([fx, fz]) => g.add(rbox(0.05, 0.05, 0.02, 0.008, ac, fx * w, h * 0.5, fz * (dp + 0.016))));
        [-0.3, 0, 0.3].forEach(f => g.add(rbox(w * 0.8, 0.01, 0.04, 0.005, S(d.col || '#2b2e31', 0.4, 0.2), 0, h + 0.004, f * dp)));
      }
      if (opts.rack && RACKS[opts.rack] && st !== 'soft') {
        /* the canopy's roof rack, riding on the lid. A clam lid slopes, so the towers grow towards the low end to keep it level. */
        const lidAt = st === 'clam' ? (z => h * (0.55 + 0.45 * (z / dp + 0.5))) : null;
        rackModel(g, RACKS[opts.rack], w, dp, h, Math.min(RACKS[opts.rack].spread || 0, d.L - 200) * MM, 0, S, lidAt);
      }
      break;
    }
    case 'awning': {
      buildAwning(g, d, w, h, dp, S, opts.sx || -1, opts.sz || 1);
      break;
    }
    case 'panel': {
      g.add(rbox(w, h, dp, 0.006, S('#202326', 0.5, 0.2), 0, h / 2, 0));
      g.add(rbox(w * 0.96, h * 0.92, 0.008, 0.004, S('#c8282d', 0.5, 0.2), 0, h / 2, dp / 2));
      [-0.25, 0.25].forEach(f => g.add(cyl(0.017, 0.012, S('#111214', 0.6, 0.1), f * w, h * 0.55, dp / 2 + 0.006, 'z', 14)));
      [-0.12, 0.12].forEach(f => g.add(rbox(0.014, 0.007, 0.006, 0.002, S('#d9dde0', 0.4, 0.4), f * w, h * 0.22, dp / 2 + 0.005)));

    }

      break;
    }
    case 'pump': {
      g.add(rbox(w * 0.9, h * 0.08, dp, 0.004, dark, 0, h * 0.04, 0));
      g.add(cyl(h * 0.36, dp * 0.55, S('#4a6a8a', 0.5, 0.3), 0, h * 0.45, dp * 0.18, 'z', 18));
      g.add(rbox(w * 0.8, h * 0.8, dp * 0.4, 0.02, S('#1b1d20', 0.6, 0.1), 0, h * 0.45, -dp * 0.28));
      [-1, 1].forEach(s => g.add(cyl(0.012, 0.04, S('#2b6cb0', 0.5, 0.1), s * w * 0.3, h * 0.6, -dp / 2 - 0.01, 'z', 10)));

    default: {
      g.add(rbox(w, h * 0.8, dp, 0.02, S(d.col || '#c4492f', 0.55, 0.15), 0, h * 0.4, 0));
      g.add(rbox(w + 0.004, h * 0.2, dp + 0.004, 0.02, S(d.lid || '#2b2f33', 0.55, 0.15), 0, h * 0.9, 0));
      [-1, 1].forEach(s => g.add(rbox(0.04, 0.05, 0.015, 0.006, steelM, s * w * 0.25, h * 0.78, dp / 2 + 0.008)));
    }
  }

  const warn = new THREE.Mesh(new THREE.BoxGeometry(w + 0.014, h + 0.014, dp + 0.014),
    new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.4, depthWrite: false }));
  warn.position.y = h / 2; warn.visible = false; warn.userData.noPick = true;
  g.add(warn);
  g.userData.warn = warn;
  g.userData.fade = [];
  if (roof) g.traverse(c => { if (c.isMesh && c !== warn) g.userData.fade.push(c.material); });
  return g;
}

/* ---------- Awnings. Closed: a zipped bag on two brackets. Open: a straight awning rolls out with two legs to the ground;
   a wing awning (270 or 180) swings round from its hinge corner, wedge by wedge, with an arm at each wedge. sx = the side it opens to,
   sz = the bag end the hinge is at (both in the bag's own frame). userData.awn.apply(k, drop) poses it: k 0..1 open, drop = metres from the bag base to the ground. ---------- */
function awnSheet(tris, mat) {
  const f = [];
  tris.forEach(t => { f.push(...t[0], ...t[1], ...t[2], ...t[0], ...t[2], ...t[1]); });
  const gg = new THREE.BufferGeometry();
  gg.setAttribute('position', new THREE.Float32BufferAttribute(f, 3));
  gg.computeVertexNormals();
  const m = new THREE.Mesh(gg, mat); m.castShadow = true; m.receiveShadow = true;
  return m;
}
function buildAwning(g, d, w, h, dp, S, sx, sz) {
  const bag = S(d.col, 0.75, 0.05), acc = S(d.acc || '#c9bd9f', 0.6, 0.05), metal = S('#9ea4aa', 0.4, 0.6), blk = S('#16181a', 0.7, 0.1);
  const can = std(d.can, 0.9, 0, { side: THREE.DoubleSide });
  const R = (d.reach || 2500) * MM, wing = d.style !== 'straight';
  /* bag, zip, end caps, mounting brackets on the roof side */
  g.add(rbox(w, h, dp, Math.min(w, h) * 0.35, bag, 0, h / 2, 0));
  g.add(rbox(w * 1.01, 0.012, dp * 0.98, 0.004, acc, 0, h * 0.62, 0));
  [-1, 1].forEach(e => g.add(rbox(w * 1.02, h * 1.02, 0.03, 0.01, blk, 0, h / 2, e * (dp / 2 - 0.012))));
  [-0.32, 0.32].forEach(f => g.add(rbox(0.06, 0.05, 0.05, 0.006, metal, -sx * (w / 2 + 0.03), h * 0.45, f * dp)));
  if (wing) g.add(cyl(0.03, h * 1.1, metal, sx * w * 0.3, h * 0.55, sz * (dp / 2 - 0.04), 'y', 12));
  const open = new THREE.Group(); open.visible = false; g.add(open);
  const legM = S('#b9bec3', 0.4, 0.6), legs = [];
  const mkLeg = (parent, x, y, z) => { const l = cyl(0.016, 1, legM, x, y, z, 'y', 8); l.userData.top = y; parent.add(l); legs.push(l); return l; };
  const droop = 0.16, cy = h * 0.55;
  let apply;
  if (!wing) {
    /* straight: the canvas rolls out from the outer face of the bag */
    const roll = new THREE.Group(); roll.position.set(sx * w / 2, cy, 0); open.add(roll);
    const L = dp - 0.06, tris = [], nx = 6, nz = 6, P = (i, j) => { const u = i / nx; return [sx * u * R, -droop * u * u, -L / 2 + j / nz * L]; };
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) tris.push([P(i, j), P(i + 1, j), P(i + 1, j + 1)], [P(i, j), P(i + 1, j + 1), P(i, j + 1)]);
    roll.add(awnSheet(tris, can));
    roll.add(cyl(0.014, L, legM, sx * R, -droop, 0, 'z', 8));
    roll.add(rbox(0.01, 0.1, L, 0.003, acc, sx * R, -droop - 0.05, 0));
    const lg = new THREE.Group(); open.add(lg);
    [-1, 1].forEach(e => mkLeg(lg, sx * (w / 2 + R), cy - droop, e * L / 2));
    apply = (k, drop) => {
      open.visible = k > 0.01; roll.scale.x = Math.max(0.02, k);
      legs.forEach(l => { const len = l.userData.top + drop; l.scale.y = len; l.position.y = l.userData.top - len / 2; l.visible = k > 0.97; });
    };
  } else {
    /* wing: wedges round the hinge corner; each wedge's far edge carries an arm */
    const tot = (d.style === '180' ? 180 : 270) * Math.PI / 180, n = d.style === '180' ? 6 : 9, st = tot / n, sgn = -sx * sz;
    const hinge = new THREE.Group(); hinge.position.set(sx * w * 0.3, cy, sz * (dp / 2 - 0.04)); open.add(hinge);
    const dir = (f, r) => [sx * Math.sin(f) * r, -droop * Math.pow(r / R, 1.6), -sz * Math.cos(f) * r];
    const piv = [];
    for (let i = 0; i < n; i++) {
      const pv = new THREE.Group(); hinge.add(pv); piv.push(pv);
      const a0 = i * st, a1 = (i + 1) * st, tris = [], nr = 5, na = 3;
      const Q = (r, q) => { const f = a0 + (a1 - a0) * q / na, p = dir(f, R * r / nr); if (r === nr) p[1] -= 0.06 * Math.sin(Math.PI * q / na); return p; };
      for (let r = 0; r < nr; r++) for (let q = 0; q < na; q++) {
        if (r === 0) tris.push([[0, 0, 0], Q(1, q), Q(1, q + 1)]);
        else tris.push([Q(r, q), Q(r + 1, q), Q(r + 1, q + 1)], [Q(r, q), Q(r + 1, q + 1), Q(r, q + 1)]);
      }
      pv.add(awnSheet(tris, can));
      pv.add(tube(Array.from({ length: 6 }, (_, k) => dir(a1, R * k / 5)), 0.013, legM, 6));
      if (d.legs && Math.abs((a1 / (Math.PI / 2)) - Math.round(a1 / (Math.PI / 2))) < 1e-6) { const e = dir(a1, R); mkLeg(pv, e[0], e[1], e[2]); }
    }
    apply = (k, drop) => {
      open.visible = k > 0.03;
      const sweep = k * tot;
      piv.forEach((pv, i) => { pv.rotation.y = sgn * (Math.min((i + 1) * st, Math.max(st, sweep)) - (i + 1) * st); });
      legs.forEach(l => { const len = l.userData.top + cy + drop; l.scale.y = len; l.position.y = l.userData.top - len / 2; l.visible = k > 0.97; });
    };
  }
  g.userData.awn = { apply };
}

/* A roof rack: a platform with slats along the length, or a pair of bars on towers. w, len = footprint (m); base = the surface it stands on;
   sp = bar spread; zc = centre; surf(z) = optional surface height under each tower (a sloped lid). */

    state.people = Math.round(Number(el.value)) || 0;
    clampState(); updateHud(); scheduleSave(); renderPanel();
  }
});
window.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (state.sel === null) return;
  const k = e.key, base = bp.on ? bp.step : 10, s = e.shiftKey ? base * 5 : base;
  if (k === 'ArrowLeft') nudge(-s, 0);
  else if (k === 'ArrowRight') nudge(s, 0);
  else if (k === 'ArrowUp') nudge(0, -s);
  else if (k === 'ArrowDown') nudge(0, s);
  else if (k === 'PageUp') liftSel(s);
  else if (k === 'PageDown') liftSel(-s);
  else if (k === 'r' || k === 'R') rotateSel();
  else if (k === 'Delete' || k === 'Backspace') removeGear(state.sel);
  else return;
  e.preventDefault();
});

/* ---------- Start ---------- */
let fitted = false;
function onResize() {
  resize();
  if (renderer && !fitted && stage.clientHeight > 50) {
    fitted = true;
    camPreset('rear34'); Object.assign(cam, cam.goal); cam.goal = null;
  }
  bpResize();
}
function init() {
  if (!loadSaved()) clampState(); /* a fresh start is the bare chassis: no tray, no canopy, no gear */
  clampState();
  bpLoadPrefs();
  renderTabs(); renderPanel(); updateHud(); syncViewButtons();
  new ResizeObserver(onResize).observe(stage);
  window.addEventListener('resize', onResize);
  bpInit();
  const err = initScene();
  if (err) {
    /* no 3D here (no WebGL, or the library did not load): the blueprint does not need it, so open that instead */
    showFail(err);
    bp.note = '3D unavailable here: plan only.';
    bpSet(true);
    onResize();
    return;
  }
  initInput();
  onResize();
  queueRebuild(['v', 't', 'c']);
  requestAnimationFrame(frame);
}
init();
</script>
